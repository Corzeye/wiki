<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CORZEYE / WIKI</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0d0b;
      --surface: #161410;
      --border: #2a2520;
      --text: #d4c9b8;
      --muted: #6b6259;
      --accent: #c8a96e;
      --accent2: #7a4f3a;
      --danger: #8b3a3a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      image-rendering: pixelated;
    }

    /* pixel noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.3;
      z-index: 999;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    .site-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .wiki-grid {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .wiki-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s, color 0.15s;
      gap: 1rem;
    }

    .wiki-entry:hover {
      background: #1e1b17;
      color: var(--accent);
    }

    .wiki-entry:hover .entry-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    .entry-left {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .entry-tag {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
    }

    .entry-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .entry-desc {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    .entry-arrow {
      font-size: 1.2rem;
      color: var(--muted);
      transition: transform 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="site-label">corzeye.com</div>
    <h1>Wiki</h1>
    <div class="subtitle">Game Universe & Lore Database</div>

    <div class="wiki-grid">
      <a class="wiki-entry" href="thatsnotjoe/index.html">
        <div class="entry-left">
          <span class="entry-tag">That's Not Joe</span>
          <span class="entry-title">Facsimiles</span>
          <span class="entry-desc">Alien species. Shapeshifters. Currently on Earth.</span>
        </div>
        <span class="entry-arrow">→</span>
      </a>
    </div>

    <div class="footer">more entries coming soon</div>
  </div>
</body>
</html>
